<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare guides</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff; --surface: #f5f8fb; --surface-2: #eaf1f7; --line: #dbe4ec;
  --text: #00264c; --muted: #4f6a85; --faint: #8399ad;
  --accent: #107aca; --accent-ink: #ffffff; --accent-soft: #d0e9fb;
  --warn: #8a5a00; --warn-soft: #ffecb2; --danger: #b3123f; --ok: #17663f; --ok-soft: #dff3e7;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #101010; --surface: #181818; --surface-2: #202020; --line: #2c2c2c;
    --text: #ececec; --muted: #a0a0a0; --faint: #707070;
    --accent: #00bfff; --accent-ink: #00264c; --accent-soft: #0d2b38;
    --warn: #ffcd4d; --warn-soft: #2b2410; --danger: #ff8aa5; --ok: #6fd3a0; --ok-soft: #12281b;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #101010; --surface: #181818; --surface-2: #202020; --line: #2c2c2c;
  --text: #ececec; --muted: #a0a0a0; --faint: #707070;
  --accent: #00bfff; --accent-ink: #00264c; --accent-soft: #0d2b38;
  --warn: #ffcd4d; --warn-soft: #2b2410; --danger: #ff8aa5; --ok: #6fd3a0; --ok-soft: #12281b;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font-family: 'Figtree', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; font-size: 14px; line-height: 1.4; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.app { display: grid; grid-template-columns: 260px minmax(0, 1fr); height: 100vh; height: 100dvh; }
nav { border-right: 1px solid var(--line); background: var(--surface); overflow-y: auto; display: flex; flex-direction: column; }
nav h1 { font-size: 1rem; margin: 0; padding: 12px 14px 4px; }
nav .sub { padding: 0 14px 10px; color: var(--muted); font-size: .8rem; }
nav .row { display: grid; grid-template-columns: 14px 1fr; gap: 8px; padding: 8px 14px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; cursor: pointer; width: 100%; }
nav .row:hover { background: var(--surface-2); }
nav .row[aria-current="true"] { background: var(--accent-soft); }
nav .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; border: 1.5px solid var(--faint); }
nav .dot.new { background: var(--ok); border-color: var(--ok); }
nav .dot.old { background: var(--warn); border-color: var(--warn); }
nav .dot.same { background: var(--accent); border-color: var(--accent); }
nav .name { font-weight: 600; word-break: break-word; }
nav .meta { color: var(--muted); font-size: .78rem; word-break: break-word; }
nav .foot { margin-top: auto; padding: 10px 14px; color: var(--muted); font-size: .78rem; border-top: 1px solid var(--line); }
main { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-width: 0; }
.panes { display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
.pane { display: grid; grid-template-rows: auto 1fr; min-width: 0; min-height: 0; }
.pane + .pane { border-left: 1px solid var(--line); }
.pane h2 { margin: 0; padding: 6px 12px; font-size: .82rem; font-weight: 600; border-bottom: 1px solid var(--line); background: var(--surface); display: flex; gap: 8px; align-items: baseline; }
.pane h2 span { color: var(--muted); font-weight: 400; }
iframe { border: 0; width: 100%; height: 100%; background: var(--bg); }
.bar { border-top: 1px solid var(--line); background: var(--surface); padding: 8px 12px; display: grid; gap: 8px; }
.bar .line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.bar .grow { flex: 1 1 260px; }
.vote { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 600; }
.vote kbd { font-family: var(--mono); font-size: .72rem; color: var(--muted); margin-right: 6px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.vote:hover { background: var(--surface-2); }
.vote[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.vote[aria-pressed="true"] kbd { color: var(--accent-ink); border-color: currentColor; }
textarea { width: 100%; height: 34px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 6px 10px; }
.nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 4px 16px; color: var(--muted); font-size: .8rem; }
.nums b { color: var(--text); font-weight: 600; }
.nums .bad { color: var(--danger); font-weight: 600; }
.tools { margin-left: auto; display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: .8rem; }
.saved { color: var(--ok); min-width: 3.2em; }
.empty { padding: 40px; color: var(--muted); }
@media (max-width: 900px) { .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } nav { max-height: 28vh; border-right: 0; border-bottom: 1px solid var(--line); } .panes { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } .pane + .pane { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<div class="app">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, props = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) k.startsWith('on') ? e.addEventListener(k.slice(2), v) : v === true ? e.setAttribute(k, '') : v !== false && v != null && e.setAttribute(k, v);
  e.append(...kids.flat().filter((x) => x != null && x !== false));
  return e;
};
let stacks = [], votes = {}, cur = 0, syncOn = true;
const LABELS = { old: 'Old better', new: 'New better', same: 'Same' };
const short = (s, n) => (s.length > n ? s.slice(0, n - 1) + '…' : s);
const kinds = (sections) => (sections || []).map((s) => s.replace('diagram:', '')).join(', ') || 'none';
const mmss = (s) => (s == null ? '?' : s >= 60 ? `${Math.floor(s / 60)}m${String(s % 60).padStart(2, '0')}` : `${s}s`);
const title = (s) => short(s.refs.map((r) => r.replace('doctolib/', '').replace(/^self:.*@/, 'self: ')).join(' + ') || s.rid, 44);

function nav() {
  const done = Object.values(votes).filter((v) => v.vote).length;
  $('#nav').replaceChildren(...[
    el('h1', {}, 'Old vs new guide'),
    el('div', { class: 'sub' }, `${done} of ${stacks.length} voted. Keys: 1 old, 2 new, 3 same, arrows move.`),
    stacks.map((s, i) => el('button', { class: 'row', type: 'button', 'aria-current': String(i === cur), onclick: () => go(i) },
      el('span', { class: `dot ${votes[s.key]?.vote || ''}`, title: LABELS[votes[s.key]?.vote] || 'not voted' }),
      el('span', {}, el('div', { class: 'name' }, title(s)), el('div', { class: 'meta' }, `${s.sid.length > 24 ? s.sid.slice(0, 24) + '…' : s.sid} · ${s.ok ? kinds(s.row.new?.sections).replace(/, /g, ' ').slice(0, 40) : 'failed'}`)))),
    el('div', { class: 'foot' }, 'Votes are saved to compare.json in the replay home.')].flat());
}

function sync(a, b) {
  // The two pages are the same origin: keep their scrolled content in step, by fraction of the scroll range.
  let busy = false;
  const link = (from, to) => from.addEventListener('scroll', () => {
    if (!syncOn || busy) return;
    busy = true;
    const range = from.scrollHeight - from.clientHeight;
    to.scrollTop = range > 0 ? (from.scrollTop / range) * (to.scrollHeight - to.clientHeight) : 0;
    requestAnimationFrame(() => { busy = false; });
  }, { passive: true });
  link(a, b); link(b, a);
}

function hook(frame, other) {
  frame.addEventListener('load', () => {
    const w = frame.contentWindow;
    w.addEventListener('keydown', keys);
    // The page calls render() on its first state poll; wait for the main scroller and for it to hold the guide.
    let tries = 0;
    const t = setInterval(() => {
      const m = w.document.getElementById('main'), o = other.contentDocument && other.contentDocument.getElementById('main');
      if (m && o && m.querySelector('.wrap') && o.querySelector('.wrap')) { clearInterval(t); w.state && (w.state.view = 'guide'); sync(m, o); }
      else if (++tries > 100) clearInterval(t);
    }, 100);
  });
}

function show() {
  const s = stacks[cur], v = votes[s.key] || {}, r = s.row, o = r.old || {}, n = r.new || {};
  const frames = [['Old', s.old, o], ['New', s.new, n]].map(([label, round, d]) => el('div', { class: 'pane' },
    el('h2', {}, `${label} guide`, el('span', {}, `round ${round}`)),
    el('iframe', { src: `/page/${s.rid}/${round}?stack=${encodeURIComponent(s.sid)}`, title: `${label} guide` })));
  const [fo, fn] = frames.map((f) => $('iframe', f));
  hook(fo, fn); hook(fn, fo);
  const note = el('textarea', { class: 'grow', placeholder: 'Note: what is better or worse (saved when you leave the field)', 'aria-label': 'Note', onblur: () => save(s.key, votes[s.key]?.vote ?? null, note.value) });
  note.value = v.note || '';
  const uncited = r.arrows ? `${r.uncited} of ${r.arrows}` : (r.ok ? 'none' : '?');
  const pct = r.arrows ? r.uncited / r.arrows : 0;
  $('#main').replaceChildren(
    el('div', { class: 'panes' }, frames),
    el('div', { class: 'bar' },
      el('div', { class: 'line' },
        ['old', 'new', 'same'].map((k, i) => el('button', { class: 'vote', type: 'button', 'aria-pressed': String(v.vote === k), onclick: () => vote(k) }, el('kbd', {}, String(i + 1)), LABELS[k])),
        note,
        el('div', { class: 'tools' }, el('span', { class: 'saved', id: 'saved' }),
          el('label', {}, el('input', { type: 'checkbox', checked: syncOn, onchange: (e) => { syncOn = e.target.checked; } }), ' sync scroll'))),
      el('div', { class: 'nums' },
        el('div', {}, 'Sections old: ', el('b', {}, kinds(o.sections))),
        el('div', {}, 'Sections new: ', el('b', {}, kinds(n.sections))),
        el('div', {}, 'Time old / new: ', el('b', {}, `${mmss(o.seconds)} / ${mmss(r.seconds)}`)),
        el('div', {}, 'Tool calls old / new: ', el('b', {}, `${o.calls ?? '?'} / ${r.calls ?? '?'}`)),
        el('div', {}, 'Uncited arrows: ', el('b', { class: pct >= 0.2 ? 'bad' : '' }, uncited)),
        el('div', {}, 'Check: ', el('b', { class: r.ok ? '' : 'bad' }, r.ok ? 'ok' : 'failed'), r.model ? ` · ${r.model}` : ''),
        r.reply ? el('div', { style: 'grid-column: 1 / -1' }, 'Writer: ', el('b', {}, short(r.reply, 200))) : null,
        !r.ok && r.check ? el('div', { class: 'bad', style: 'grid-column: 1 / -1' }, short(r.check.split('\n')[0], 240)) : null)));
  nav();
}

async function save(key, vote, note) {
  votes[key] = { vote, note, at: Math.floor(Date.now() / 1000) };
  nav();
  try {
    const r = await fetch('/api/vote', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Compare': '1' }, body: JSON.stringify({ key, vote, note }) });
    const saved = $('#saved');
    if (saved) { saved.textContent = r.ok ? 'saved' : 'not saved'; setTimeout(() => saved.textContent = '', 1500); }
  } catch (e) { const saved = $('#saved'); if (saved) saved.textContent = 'not saved'; }
}

const vote = (k) => { const s = stacks[cur], note = $('textarea').value; save(s.key, votes[s.key]?.vote === k ? null : k, note); document.querySelectorAll('.vote').forEach((b, i) => b.setAttribute('aria-pressed', String(['old', 'new', 'same'][i] === votes[s.key].vote))); };
const go = (i) => {
  if (!stacks.length) return;
  const s = stacks[cur], note = $('textarea');
  if (note && note.value !== (votes[s.key]?.note || '')) save(s.key, votes[s.key]?.vote ?? null, note.value);
  cur = (i + stacks.length) % stacks.length;
  location.hash = String(cur + 1);
  show();
};

function keys(e) {
  if (e.metaKey || e.ctrlKey || e.altKey || /^(TEXTAREA|INPUT)$/.test((e.target.tagName || ''))) return;
  if (e.key === '1') vote('old');
  else if (e.key === '2') vote('new');
  else if (e.key === '3') vote('same');
  else if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); go(cur + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); go(cur - 1); }
}
addEventListener('keydown', keys);

(async () => {
  const d = await (await fetch('/api/data', { cache: 'no-store' })).json();
  stacks = d.stacks; votes = d.votes;
  if (!stacks.length) return $('#main').replaceChildren(el('div', { class: 'empty' }, 'Nothing replayed yet. Run dev/replay.py.'));
  cur = Math.min(Math.max((parseInt(location.hash.slice(1), 10) || 1) - 1, 0), stacks.length - 1);
  show();
})();
</script>
</body>
</html>
