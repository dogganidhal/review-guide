name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: prod-linux-xs
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: doctolib/actions/checkout@568bbd82c060461931222968aef7c540f7ebe2e8 # checkout-v0.3.2

      - name: Check the manifests
        run: |
          python3 - <<'PY'
          import json, pathlib
          plugin = json.loads(pathlib.Path("plugins/review-guide/.claude-plugin/plugin.json").read_text())
          market = json.loads(pathlib.Path(".claude-plugin/marketplace.json").read_text())
          manifest = json.loads(pathlib.Path(".release-please-manifest.json").read_text())
          assert plugin["name"] == "review-guide", plugin["name"]
          assert market["plugins"][0]["name"] == plugin["name"], market["plugins"][0]
          assert manifest["plugins/review-guide"] == plugin["version"], (manifest, plugin["version"])
          print("manifests ok, version", plugin["version"])
          PY

      - name: Run the offline test
        run: python3 -I plugins/review-guide/skills/review-guide/scripts/test_scripts.py
