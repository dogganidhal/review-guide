<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review guide</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root {
  --bg: #ffffff; --surface: #f5f8fb; --surface-2: #eaf1f7; --line: #dbe4ec;
  --text: #00264c; --muted: #4f6a85; --faint: #8399ad;
  --accent: #107aca; --accent-ink: #ffffff; --accent-soft: #d0e9fb;
  --add: #e6f5ea; --add-num: #cdebd6; --del: #ffe5e8; --del-num: #ffd0d7; --hot: #ffcd4d;
  --warn: #8a5a00; --warn-soft: #ffecb2; --danger: #b3123f; --danger-soft: #ffe5e8; --ok: #17663f; --ok-soft: #dff3e7;
  --syn-kw: #004080; --syn-str: #17663f; --syn-com: #6b8299; --syn-num: #9a5b00; --syn-fn: #107aca; --syn-type: #7a3e9d;
  color-scheme: light;
  --hot-ink: #00264c;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #101010; --surface: #181818; --surface-2: #202020; --line: #2c2c2c;
    --text: #ececec; --muted: #a0a0a0; --faint: #707070;
    --accent: #00bfff; --accent-ink: #00264c; --accent-soft: #0d2b38;
    --add: #12261a; --add-num: #173322; --del: #2b1519; --del-num: #3a1b21; --hot: #ffcd4d;
    --warn: #ffcd4d; --warn-soft: #2b2410; --danger: #ff8aa5; --danger-soft: #2e1820; --ok: #6fd3a0; --ok-soft: #12281b;
    --syn-kw: #7cc4ff; --syn-str: #8fd6a8; --syn-com: #7d7d7d; --syn-num: #ffcd4d; --syn-fn: #00bfff; --syn-type: #d4a5ff;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #101010; --surface: #181818; --surface-2: #202020; --line: #2c2c2c;
  --text: #ececec; --muted: #a0a0a0; --faint: #707070;
  --accent: #00bfff; --accent-ink: #00264c; --accent-soft: #0d2b38;
  --add: #12261a; --add-num: #173322; --del: #2b1519; --del-num: #3a1b21; --hot: #ffcd4d;
  --warn: #ffcd4d; --warn-soft: #2b2410; --danger: #ff8aa5; --danger-soft: #2e1820; --ok: #6fd3a0; --ok-soft: #12281b;
  --syn-kw: #7cc4ff; --syn-str: #8fd6a8; --syn-com: #7d7d7d; --syn-num: #ffcd4d; --syn-fn: #00bfff; --syn-type: #d4a5ff;
}
* { box-sizing: border-box; scrollbar-width: none; }
::-webkit-scrollbar { display: none; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font-family: 'Figtree', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; font-size: 15px; line-height: 1.45; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
.top { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--bg); flex-wrap: wrap; }
.top .brand { font-weight: 700; white-space: nowrap; }
.chain { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.chain .arrow { color: var(--faint); }
.prchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; background: var(--bg); cursor: pointer; font-size: .85rem; }
.prchip[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.prchip .t { color: var(--muted); max-width: 26ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }
.stackmenu { position: relative; }
.stackmenu > summary { list-style: none; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 99px; padding: 3px 12px; cursor: pointer; font-size: .85rem; }
.stackmenu > summary::-webkit-details-marker { display: none; }
.stackmenu > summary .t { color: var(--muted); max-width: 40ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stackmenu[open] > summary { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.stackmenu .panel { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; width: min(760px, calc(100vw - 32px)); max-height: 70vh; overflow-y: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgb(0 0 0 / .18); }
.stackmenu .fails { display: none; }
.prrow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto 22px; gap: 2px 10px; align-items: center; padding: 5px 10px; border-top: 1px solid var(--line); font-size: .85rem; }
.prrow:first-child { border-top: 0; }
.prrow .i { color: var(--faint); font-size: .75rem; text-align: right; font-variant-numeric: tabular-nums; }
.prrow .pick { display: flex; align-items: center; gap: 8px; min-width: 0; background: none; border: 0; padding: 2px 6px; border-radius: 6px; cursor: pointer; text-align: left; }
.prrow .pick:hover { background: var(--surface-2); }
.prrow .pick[aria-pressed="true"] { background: var(--accent-soft); }
.prrow .t { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prrow .gh { text-align: center; }
.prrow .fails { grid-column: 2 / -1; padding: 0 6px 3px 23px; font-size: .76rem; color: var(--danger); }
.ci { font-size: .75rem; font-weight: 700; white-space: nowrap; }
.ci.bad { color: var(--danger); }
.ci.wait { color: var(--warn); }
.ci.ok { color: var(--ok); }
.ci.none { color: var(--faint); font-weight: 400; }
.prlist { border: 1px solid var(--line); border-radius: 12px; background: var(--bg); margin-bottom: 16px; }
.prlist > summary { cursor: pointer; padding: 9px 12px; font-weight: 600; font-size: .9rem; }
.prlist[open] > summary { border-bottom: 1px solid var(--line); }
.tabs { margin-left: auto; display: flex; gap: 4px; }
.tab { border: 1px solid transparent; background: none; padding: 5px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--accent-soft); color: var(--text); }
.iconbtn { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 4px 9px; cursor: pointer; color: var(--muted); font-size: .85rem; }

.body { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 0; }
.side { border-right: 1px solid var(--line); background: var(--surface); overflow-y: auto; overflow-x: hidden; padding: 12px 0 24px; }
.ftree { overflow-x: auto; overscroll-behavior-x: contain; }
.ftree .rows { width: max-content; min-width: 100%; }
.side .tools { display: flex; gap: 6px; padding: 0 12px 10px; flex-wrap: wrap; }
.side input[type=search] { width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 8px; padding: 6px 9px; font: inherit; font-size: .85rem; }
.fchip { border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 2px 9px; font-size: .78rem; cursor: pointer; color: var(--muted); }
.fchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.side .count { padding: 0 12px 6px; font-size: .75rem; color: var(--faint); }
.tdir { display: flex; align-items: center; gap: 4px; padding: 3px 12px; font-size: .8rem; color: var(--muted); cursor: pointer; font-family: var(--mono); white-space: nowrap; }
.tdir:hover { background: var(--surface-2); }
.tfile { display: flex; align-items: center; gap: 7px; padding: 3px 12px; font-size: .84rem; cursor: pointer; border-left: 3px solid transparent; }
.tfile:hover { background: var(--surface-2); }
.tfile[aria-current="true"] { background: var(--accent-soft); border-left-color: var(--accent); }
.tfile .nm { flex: 1; white-space: nowrap; font-family: var(--mono); font-size: .78rem; }
.tfile { --row: var(--surface); }
.tfile:hover { --row: var(--surface-2); }
.tfile[aria-current="true"] { --row: var(--accent-soft); }
.tfile .tail { position: sticky; right: 0; display: inline-flex; align-items: center; gap: 6px; margin-right: -12px; padding: 0 12px 0 16px; align-self: stretch; background: linear-gradient(to right, transparent, var(--row) 12px); }
.tfile.viewed .nm { color: var(--faint); text-decoration: line-through; }
.tfile.dim { opacity: .4; }
.newmark { font-size: .66rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--hot-ink); background: var(--hot); border-radius: 4px; padding: 0 4px; font-family: 'Figtree', sans-serif; }
.runpanel { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 8px; margin-bottom: 14px; font-size: .84rem; }
.runpanel:empty { display: none; }
.runpanel:not(:empty) ~ .pendingbox { display: none; }
.runpanel .rh { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px; }
.runpanel .rh b { font-weight: 600; }
.runpanel .rh .t { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 400; }
.runpanel .rh .lvl { color: var(--faint); font-size: .78rem; }
.runpanel .bar { height: 3px; border-radius: 99px; background: var(--surface-2); margin: 8px 0 4px; overflow: hidden; }
.runpanel .bar span { display: block; height: 100%; background: var(--accent); transition: width .4s; }
.runpanel .row { display: grid; grid-template-columns: 14px 6.5rem minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 3px 0; }
.runpanel .row .nm { font-weight: 600; }
.runpanel .row .d { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.runpanel .row.running .d { font-family: var(--mono); font-size: .76rem; }
.runpanel .row .t { color: var(--faint); font-variant-numeric: tabular-nums; font-size: .78rem; }
.runpanel .row.waiting, .runpanel .row.waiting .d { color: var(--faint); }
.runpanel .row.waiting .nm { font-weight: 400; }
.runpanel .ic { text-align: center; }
.runpanel .done .ic { color: var(--ok); }
.runpanel .failed .ic, .runpanel .failed .d { color: var(--danger); }
.runpanel .skipped .ic { color: var(--faint); }
.runpanel .spin { width: 11px; height: 11px; }
@media (max-width: 640px) { .runpanel .row { grid-template-columns: 14px minmax(0, 1fr) auto; } .runpanel .row .d { grid-column: 2 / -1; grid-row: 2; } }
.usual { font-size: .78rem; color: var(--faint); }
.rerunbox { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-size: .86rem; margin-bottom: 14px; }
.rerunbox.stale { border-color: var(--warn); background: var(--warn-soft); }
.rerunbox .msg { flex: 1 1 260px; }
.rerunbox .err { color: var(--danger); flex-basis: 100%; }
.meta button { padding: 1px 9px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font: inherit; cursor: pointer; }
.sincebox { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; border: 1px solid var(--hot); border-radius: 10px; padding: 9px 12px; font-size: .86rem; margin-bottom: 14px; }
.role { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.role.read { background: var(--accent); }
.role.skim { background: var(--accent-soft); outline: 1px solid var(--accent); outline-offset: -1px; }
.role.skip { background: var(--line); }
.role.pending { background: transparent; outline: 1px dashed var(--faint); outline-offset: -1px; }
.pendingbox { display: flex; gap: 10px; align-items: center; border: 1px dashed var(--line); border-radius: 12px; padding: 14px 16px; color: var(--muted); margin: 10px 0 18px; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin 1s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.st.checking { color: var(--faint); }
.badge { font-size: .7rem; font-weight: 700; border-radius: 99px; padding: 0 6px; background: var(--warn-soft); color: var(--warn); }
.prdots { display: inline-flex; gap: 2px; }
.prdots .dot { width: 6px; height: 6px; }

main { overflow: auto; padding: 22px clamp(16px, 3vw, 40px) 120px; }
.wrap { max-width: 1060px; }
h1 { font-size: 1.35rem; line-height: 1.2; margin: 0 0 6px; }
.summary { margin: 0 0 10px; max-width: 80ch; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; font-size: .78rem; }
.meta span, .meta a { padding: 1px 9px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.meta .bad { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; margin: 4px 0 10px; }
.tile { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px 10px; background: var(--surface); min-width: 0; }
.tile .k { font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; }
.tile .v { display: flex; align-items: center; gap: 6px; font-size: 1.2rem; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tile .s { font-size: .8rem; color: var(--muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile.ok { background: var(--ok-soft); border-color: transparent; } .tile.ok .v { color: var(--ok); }
.tile.bad { background: var(--danger-soft); border-color: transparent; } .tile.bad .v { color: var(--danger); }
.tile.wait { background: var(--warn-soft); border-color: transparent; } .tile.wait .v { color: var(--warn); }
.tile .add { color: var(--ok); } .tile .del { color: var(--danger); }
.sizebar { display: flex; height: 5px; border-radius: 99px; overflow: hidden; margin-top: 7px; background: var(--surface-2); }
.sizebar .a { background: var(--ok); } .sizebar .d { background: var(--danger); }
.warnbox { border: 1px solid var(--warn-soft); background: var(--warn-soft); color: var(--text); border-radius: 10px; padding: 8px 12px; font-size: .85rem; margin-bottom: 14px; }
.warnbox summary { cursor: pointer; font-weight: 600; color: var(--warn); }
.warnbox p { margin: 6px 0 0; }
.sec { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 22px 0 8px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; }
.sec .aside { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--faint); }

/* Diagrams: one frame for every kind, the SVG scaled to the content width (see dgFit). */
.dgm { position: relative; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
.dgm .dgs { overflow: auto; padding: 4px 0; }
.dgm .dgs svg { display: block; margin: 0 auto; }
.dgx { border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 8px; padding: 1px 10px; font-size: .78rem; cursor: pointer; }
.dgx[hidden] { display: none; }
.dgl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 7px 12px; border-top: 1px solid var(--line); font-size: .75rem; color: var(--muted); }
.dgl .hint { color: var(--faint); margin-left: auto; }
.dgl .sw { display: inline-block; width: 14px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; border: 1.5px solid var(--line); }
.dgl .sw.new { background: var(--accent); border-color: var(--accent); }
.dgl .sw.changed { background: var(--accent-soft); border-color: var(--accent); }
.dgl .sw.existing { background: var(--bg); border-color: var(--faint); }
.dgl .sw.external { background: var(--surface-2); border: 1.5px dashed var(--faint); }
.dgl .sw.removed { background: var(--danger-soft); border: 1.5px dashed var(--danger); }
.dgl .swl { display: inline-block; width: 22px; vertical-align: 3px; margin-right: 5px; border-top: 1.5px dashed var(--faint); }
.dgl .swl.guess { opacity: .7; border-top-style: dotted; border-top-width: 2px; }
.dgfull { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; }
.dgfull .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.dgfull .dgs { flex: 1; overflow: auto; padding: 16px; }
.dgfull .dgs svg { display: block; margin: 0 auto; }
svg.dg { font-family: 'Figtree', sans-serif; overflow: visible; }
svg.dg text { dominant-baseline: central; text-anchor: middle; pointer-events: none; }
svg.dg text.st { text-anchor: start; }
svg.dg text.en { text-anchor: end; }
svg.dg .nt { font: 600 12.5px 'Figtree', sans-serif; fill: var(--text); }
svg.dg .nc { font: 11px 'JetBrains Mono', monospace; fill: var(--muted); }
svg.dg .dl { font: 11.5px 'Figtree', sans-serif; fill: var(--muted); }
svg.dg .dn .box { fill: var(--bg); stroke: var(--faint); stroke-width: 1.5; }
svg.dg .dn .lid, svg.dg .dn .inner { fill: none; stroke: inherit; stroke-width: 1.2; }
svg.dg .dn.new .box { fill: var(--accent); stroke: var(--accent); }
svg.dg .dn.new .lid, svg.dg .dn.new .inner { stroke: var(--accent-ink); }
svg.dg .dn.new > text, svg.dg .dn.new .nc { fill: var(--accent-ink); }
svg.dg .dn.changed .box { fill: var(--accent-soft); stroke: var(--accent); }
svg.dg .dn.changed .lid, svg.dg .dn.changed .inner { stroke: var(--accent); }
svg.dg .dn.existing .lid, svg.dg .dn.existing .inner { stroke: var(--faint); }
svg.dg .dn.external .box { fill: var(--surface-2); stroke-dasharray: 4 3; }
svg.dg .dn.external .lid { stroke: var(--faint); }
svg.dg .dn.removed .box { fill: var(--danger-soft); stroke: var(--danger); stroke-dasharray: 5 3; }
svg.dg .dn.removed > text { fill: var(--danger); text-decoration: line-through; }
svg.dg .dn.removed .nc { fill: var(--danger); }
svg.dg .dn.end .box { stroke-width: 2.5; }
svg.dg .dn.card .box { fill: var(--bg); }
svg.dg .dn.card .cardhead { fill: var(--surface-2); }
svg.dg .dn.card > text { fill: var(--text); }
svg.dg .dn.card.new .box { fill: var(--bg); stroke: var(--accent); stroke-width: 2; } svg.dg .dn.card.new .cardhead { fill: var(--accent); } svg.dg .dn.card.new > text { fill: var(--accent-ink); }
svg.dg .dn.card.changed .box { fill: var(--bg); } svg.dg .dn.card.changed .cardhead { fill: var(--accent-soft); } svg.dg .dn.card.changed > text { fill: var(--text); }
svg.dg .dn.card.removed .cardhead { fill: var(--danger-soft); }
svg.dg .fld text { font: 11.5px 'JetBrains Mono', monospace; fill: var(--text); }
svg.dg .fld .ft { fill: var(--muted); }
svg.dg .fld .fm { font-weight: 700; }
svg.dg .fld.added .fbg { fill: var(--add); } svg.dg .fld.added .fm { fill: var(--ok); }
svg.dg .fld.removed .fbg { fill: var(--del); } svg.dg .fld.removed .fm { fill: var(--danger); } svg.dg .fld.removed .fn, svg.dg .fld.removed .ft { text-decoration: line-through; fill: var(--danger); }
svg.dg .fld.changed .fbg { fill: var(--warn-soft); } svg.dg .fld.changed .fm { fill: var(--warn); }
svg.dg .dn.link { cursor: pointer; }
svg.dg .dn.link:hover .box { stroke-width: 2.5; }
svg.dg .dn.hot .box, svg.dg .dn.lit .box { stroke: var(--hot); stroke-width: 3; }
svg.dg .cl rect { fill: var(--surface); stroke: var(--line); }
svg.dg .cl text { font: 700 10.5px 'Figtree', sans-serif; letter-spacing: .06em; fill: var(--faint); paint-order: stroke; stroke: var(--surface); stroke-width: 5px; stroke-linejoin: round; }
svg.dg .de .line { fill: none; stroke: var(--faint); stroke-width: 1.5; }
svg.dg .de .hit { fill: none; stroke: transparent; stroke-width: 12; }
svg.dg .de.link { cursor: pointer; }
svg.dg .de.new .line { stroke: var(--accent); stroke-width: 2; }
svg.dg .de.new .dl { fill: var(--text); }
svg.dg .de.ret .line { stroke-dasharray: 6 4; stroke-width: 1.5; }
svg.dg .de.guess .line { stroke-dasharray: 2 4; opacity: .65; }
svg.dg .de.guess .dl { font-style: italic; }
svg.dg .de.removed .line { stroke: var(--danger); stroke-dasharray: 5 3; }
svg.dg .de.removed .dl { fill: var(--danger); text-decoration: line-through; }
svg.dg .de .lbg { fill: var(--bg); }
svg.dg .de.link:hover .line { stroke-width: 3; }
svg.dg .de.link:hover .dl { fill: var(--text); }
svg.dg.focus .de:not(.lit), svg.dg.focus .dn:not(.lit) { opacity: .35; }
svg.dg .de.lit .line { stroke: var(--hot); stroke-width: 2.5; opacity: 1; }
svg.dg .mk { fill: var(--faint); } svg.dg .mk.new { fill: var(--accent); } svg.dg .mk.removed { fill: var(--danger); } svg.dg .mk.guess { fill: var(--faint); opacity: .65; }
svg.dg .mk.ret { fill: none; stroke: var(--faint); stroke-width: 1.5; }
svg.dg .init circle { fill: var(--text); } svg.dg .init path { fill: none; stroke: var(--faint); stroke-width: 1.5; }

<script>
const DATA = /*DATA*/null;
const TOKEN = '/*TOKEN*/';

const STATUS = { verified: '✓ checked in the code', unverified: '? could not confirm', refuted: '✕ disproved', checking: '… being checked' };
const LANG = { java: 'java', kt: 'kotlin', kts: 'kotlin', py: 'python', ts: 'typescript', tsx: 'typescript', js: 'javascript', jsx: 'javascript', mjs: 'javascript',
  go: 'go', rb: 'ruby', rs: 'rust', sql: 'sql', sh: 'bash', bash: 'bash', yml: 'yaml', yaml: 'yaml', xml: 'xml', html: 'xml', json: 'json', md: 'markdown',
  toml: 'ini', ini: 'ini', properties: 'ini', css: 'css', scss: 'scss', graphql: 'graphql', swift: 'swift', php: 'php', cs: 'csharp', c: 'c', h: 'c', cpp: 'cpp' };

const defaults = { stack: DATA.stacks[0].id, view: 'guide', file: null, filter: 'all', q: '', focus: null, open: {}, done: {}, viewed: {}, collapsed: {}, cm: {}, cmOpen: {}, extra: {}, verdict: {}, lost: [] };

if (!DATA.stacks.some((s) => s.id === state.stack)) state.stack = DATA.stacks[0].id;
let posted = {};
// Saved on the server, next to the round, a moment after the last change; earlier rounds are read-only.
let saveTimer = null, saveErr = '';
const putState = (keepalive) => fetch(`${API}/ui`, { method: 'PUT', keepalive, headers: { 'Content-Type': 'application/json', 'X-Review-Token': TOKEN }, body: JSON.stringify(state) })

document.addEventListener('visibilitychange', () => document.visibilityState === 'hidden' && flush());

const ext = (href, label, cls) => el('a', { href, target: '_blank', rel: 'noopener', class: cls }, label);
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

const ST = () => DATA.stacks.find((s) => s.id === state.stack);
const prIndex = (st, n) => st.prs.findIndex((p) => p.n === n);
const prColor = (st, n) => PR_COLORS[prIndex(st, n) % PR_COLORS.length];

const prOf = (n) => DATA.stacks.flatMap((s) => s.prs).find((p) => p.n === n);

  return dgSvg(kind, sec.title, dgBounds(boxes), [...out, ...labels]);
}

// Sequence: participants as columns, calls solid and returns dashed, self-calls, notes, and alt/opt/loop frames.
function sequenceSvg(st, sec) {
  const comps = dgComps(st), id = ++dgSeq;
  const parts = sec.participants.map((p) => ({ state: 'existing', ...(comps[p] || { id: p, label: p }) })), col = new Map(parts.map((p, i) => [p.id, i]));
  const heads = parts.map((p) => dgNode('structure', p));
  const rows = [], open = [];
  let num = 0, depth = 0;
  const walk = (items, d) => {
    for (const it of items || []) {
      if (it.frame) {
        const fr = { type: 'open', it, d, rows: [], kids: [] };
        open.at(-1)?.kids.push(fr); rows.push(fr); open.push(fr); depth = Math.max(depth, d + 1);
        (it.branches || []).forEach((b, k) => { if (k) rows.push({ type: 'branch', fr, guard: b.guard }); walk(b.messages, d + 1); });
        open.pop(); rows.push({ type: 'close', fr });
        continue;
      }
      const r = 'note' in it ? { type: 'note', it, a: col.get(it.on), lines: dgWrap(it.note, DGF.label, 190) }
        : { type: 'msg', it, a: col.get(it.from), b: col.get(it.to), n: it.return ? null : ++num, label: plain(it.label) };
      if (r.a === undefined || (r.type === 'msg' && r.b === undefined)) continue;
      open.forEach((fr) => fr.rows.push(r));
      rows.push(r);
    }
  };
  walk(sec.messages, 0);
  // Columns: far enough apart for the heads, then for each label between them.
  const C = parts.slice(1).map((_, i) => [i, i + 1, (heads[i].w + heads[i + 1].w) / 2 + 24]);
  for (const r of rows) {
    if (r.type === 'msg') {
      r.lw = dgW(r.label, DGF.label);
      if (r.a === r.b) { if (r.a + 1 < parts.length) C.push([r.a, r.a + 1, 46 + r.lw + 24]); }
      else C.push([Math.min(r.a, r.b), Math.max(r.a, r.b), r.lw + (r.n ? 64 : 36)]);
    } else if (r.type === 'note') {
      r.w = Math.max(...r.lines.map((l) => dgW(l, DGF.label))) + 18;
      if (r.a > 0) C.push([r.a - 1, r.a, r.w / 2 + 24]);
      if (r.a + 1 < parts.length) C.push([r.a, r.a + 1, r.w / 2 + 24]);
    }
  }
  const xs = parts.map(() => 0);
  for (const [i, j, d] of C.sort((p, q) => p[1] - q[1])) if (xs[j] - xs[i] < d) for (let k = j; k < xs.length; k++) xs[k] += d - (xs[j] - xs[i]) + (k > j ? 0 : 0);
  const HH = Math.max(...heads.map((h) => h.h));
  let y = 12 + HH + 18;
  for (const r of rows) {
    if (r.type === 'msg') { if (r.a === r.b) { r.y = y + 16; y += 50; } else { r.y = y + 26; y += 38; } }
    else if (r.type === 'note') { r.h = r.lines.length * 15 + 12; r.y = y + 6; y += r.h + 14; }
    else if (r.type === 'open') { r.y = y + 4; y += 30; }
    else if (r.type === 'branch') { r.y = y + 4; y += 28; }
    else { r.fr.bottom = y + 8; y += 16; }
  }
  const H = y + 10;
  // Frames: around what they hold, inner ones first so an outer frame always contains them.
  const ext = (r) => (r.type === 'note' ? [xs[r.a] - r.w / 2, xs[r.a] + r.w / 2] : r.a === r.b ? [xs[r.a], xs[r.a] + 46 + r.lw] : [Math.min(xs[r.a], xs[r.b]), Math.max(xs[r.a], xs[r.b])]);
  const frames = rows.filter((r) => r.type === 'open').reverse();
  for (const fr of frames) {
    const pad = 18 + (depth - 1 - fr.d) * 12, e = fr.rows.map(ext);
    fr.left = Math.min(...e.map((v) => v[0]), ...fr.kids.map((k) => k.left - 10)) - pad;
    fr.right = Math.max(...e.map((v) => v[1]), ...fr.kids.map((k) => k.right + 10)) + pad;
    fr.tab = dgW(fr.it.frame, DGF.tab) + 16;
    const guards = (fr.it.branches || []).map((b, k) => dgW(`[${plain(b.guard)}]`, DGF.label) + (k ? 16 : fr.tab + 16));
    fr.right = Math.max(fr.right, fr.left + Math.max(...guards) + 12);
  }
  const out = [dgMarkers(id)], boxes = [];
  parts.forEach((p, i) => {
    const h = heads[i], x = xs[i] - h.w / 2, t = dgTarget(st, p.at, p.path);
    boxes.push({ x, y: 12, w: h.w, h: h.h });
    out.push(svg('line', { class: 'life', 'data-life': p.id, x1: xs[i], y1: 12 + h.h, x2: xs[i], y2: H - 6 }));
    out.push(svg('g', { class: `dn ${p.state} comp${t ? ' link' : ''}`, 'data-id': p.id, onclick: dgClick(t) }, dgTitle(`${plain(p.label)} (${p.state})`, t), h.draw(x, 12)));
  });
  for (const fr of frames) {
    boxes.push({ x: fr.left, y: fr.y, w: fr.right - fr.left, h: fr.bottom - fr.y });
    out.push(svg('g', { class: 'frame' }, svg('rect', { x: fr.left, y: fr.y, width: fr.right - fr.left, height: fr.bottom - fr.y, rx: 4 }),
      svg('path', { class: 'tab', d: `M${fr.left},${fr.y} h${fr.tab} v12 l-6,6 H${fr.left} Z` }),
      svg('text', { class: 'tabt st', x: fr.left + 7, y: fr.y + 9 }, fr.it.frame),
      svg('text', { class: 'dl fg st', x: fr.left + fr.tab + 8, y: fr.y + 9 }, `[${plain(fr.it.branches?.[0]?.guard)}]`)));
  }
  for (const r of rows) {
    if (r.type === 'branch') {
      out.push(svg('g', { class: 'frame' }, svg('line', { class: 'div', x1: r.fr.left, y1: r.y, x2: r.fr.right, y2: r.y }),
        svg('text', { class: 'dl fg st', x: r.fr.left + 8, y: r.y + 11 }, `[${plain(r.guard)}]`)));
    } else if (r.type === 'note') {
      const x = xs[r.a] - r.w / 2, t = dgTarget(st, r.it.at);
      boxes.push({ x, y: r.y, w: r.w, h: r.h });
      out.push(svg('g', { class: `dnote${t ? ' link' : ''}`, onclick: dgClick(t) }, dgTitle(plain(r.it.note), t),
        svg('rect', { class: 'box', x, y: r.y, width: r.w, height: r.h, rx: 4 }), dgText(r.lines, xs[r.a], r.y + r.h / 2, 'nl', 15)));
    } else if (r.type === 'msg') {
      const it = r.it, a = xs[r.a], b = xs[r.b], t = dgTarget(st, it.at), from = parts[r.a].id, to = parts[r.b].id;
      const g = svg('g', { class: dgEdgeClass(it, false, t) + ' seq', 'data-n': `${from} ${to}`, 'data-from': from, 'data-to': to, onclick: dgClick(t) },
        dgTitle(r.label, t));
      if (r.a === r.b) {
        const d = `M${a + 1},${r.y} H${a + 32} V${r.y + 18} H${a + 1}`;
        g.append(svg('path', { class: 'hit', d }), svg('path', { class: 'line', d, 'marker-end': dgMarker(id, it) }),
          svg('text', { class: 'dl st', x: a + 40, y: r.y + 9 }, r.label));
        boxes.push({ x: a, y: r.y - 4, w: 46 + r.lw, h: 26 });
        if (r.n) g.append(svg('circle', { class: 'num', cx: a - 13, cy: r.y, r: 8 }), svg('text', { class: 'numt', x: a - 13, y: r.y }, r.n));
      } else {
        const dir = b > a ? 1 : -1, d = `M${a + dir},${r.y} L${b - dir},${r.y}`;
        g.append(svg('path', { class: 'hit', d }), svg('path', { class: 'line', d, 'marker-end': dgMarker(id, it) }),
          svg('text', { class: 'dl', x: (a + b) / 2 + (r.n ? dir * 10 : 0), y: r.y - 10 }, r.label));
        if (r.n) g.append(svg('circle', { class: 'num', cx: a + dir * 14, cy: r.y, r: 8 }), svg('text', { class: 'numt', x: a + dir * 14, y: r.y }, r.n));
      }
      out.push(g);
    }

  return dgSvg('sequence', sec.title, dgBounds([...boxes, { x: xs[0], y: 0, w: 1, h: H }]), out);
}

// The frame: fills the content width, scales down to DG_MIN, then scrolls and offers Expand (full screen, Esc closes).
const dgFits = new WeakMap(), dgRO = new ResizeObserver((es) => es.forEach((e) => dgFits.get(e.target)?.()));

  const fit = () => {
    const C = box.clientWidth, W = +sv.dataset.w, H = +sv.dataset.h;
    if (!C) return;
    const s = Math.max(DG_MIN, Math.min(1, (C - 2) / W));
    sv.style.width = `${W * s}px`; sv.style.height = `${H * s}px`;
    if (btn) btn.hidden = W * s <= C;

}
function dgExpand(build, title) {
  document.querySelector('.dgfull')?.remove();

  const close = () => { wrap.remove(); removeEventListener('keydown', esc); };
  const esc = (e) => e.key === 'Escape' && close();

    el('div', { class: 'bar' }, el('b', {}, title), el('button', { class: 'btn', type: 'button', onclick: close }, 'Close')), body);
  addEventListener('keydown', esc);

}
function diagramView(st, sec) {

  const build = () => {
    if (sec.kind === 'sequence') return sequenceSvg(st, sec);
    const lr = graphSvg(st, sec);
    if (sec.direction || !['states', 'data'].includes(sec.kind) || +lr.dataset.w <= 1100) return lr;
    const tb = graphSvg(st, { ...sec, direction: 'TB' });
    return fitAt(tb) > fitAt(lr) + 0.05 ? tb : lr;
  };
  const sv = build(), body = el('div', { class: 'dgs' }, sv);
  const btn = el('button', { class: 'dgx', type: 'button', hidden: true, onclick: () => dgExpand(build, sec.title) }, 'Expand');
  const has = (q) => !!sv.querySelector(q);
  const sw = (cls, text) => el('span', {}, el('i', { class: 'sw ' + cls }), text);
  const legend = el('div', { class: 'dgl' },
    DG_STATES.filter((s) => has(`.dn.${s}`)).map((s) => sw(s, s)),
    has('.de.guess') ? el('span', {}, el('i', { class: 'swl guess' }), 'no line cited') : null,
    has('.de.ret') ? el('span', {}, el('i', { class: 'swl ret' }), 'return') : null,
    has('.link') ? el('span', { class: 'hint' }, 'click a box or an arrow to open its code') : null, btn);

const RISK = { open: 'open', decided: 'decided', accepted: 'accepted limit' };

// A step lights up its nodes in every diagram, by class, without redrawing.

}

function sectionView(st, sec) {

const AXES = [['correctness', 'Correctness', 'bugs, risk, and what depends on the change'], ['standards', 'Standards', "the repo's documented rules and code smells"],
  ['spec', 'Spec', 'the ticket and the PR description']];
function findingsView(st) {

function codeBlock(st, rows, path, { excerpt, link, title, bare, onOpen, oldNums } = {}) {
  const flat = Array.isArray(rows[0]) ? rows.flat() : rows;
  const texts = (k) => flat.filter((r) => (k === '-') === (r.k === '-'));
  const nw = texts('+'), od = texts('-');
  const hNew = highlight(nw.map((r) => r.t), path), hOld = highlight(od.map((r) => r.t), path);
  const html = new Map([...nw.map((r, i) => [r, hNew[i]]), ...od.map((r, i) => [r, hOld[i]])]);
  const byLine = new Map();
  if (!bare) for (const c of comments(st)) if (c.path === path) (byLine.get(c.line) || byLine.set(c.line, []).get(c.line)).push(c);
  const box = el('div', { class: 'code' });
  if (title || link) box.append(el('div', { class: 'head' }, onOpen ? el('button', { type: 'button', onclick: onOpen, title: 'Open the file' }, title || path) : el('span', {}, title || path), link ? ext(link, 'GitHub ↗') : null));

    const strip = el('span', { style: r.pr ? `background:${prColor(st, r.pr)}` : '', title: r.pr ? `written by #${r.pr}` : null });
    const src = el('span', { class: 'src', html: html.get(r) || ' ' });
    const fresh = r.k === '+' && sinceLines(st, path)?.includes(r.n);

    if (excerpt && r.k === '-' && oldNums) num.textContent = r.o;
    box.append(excerpt ? el('div', { class: cls }, num, strip, src) : el('div', { class: cls }, el('span', { class: 'no' }, r.k === '+' ? '' : r.o), num, strip, src));

// The few diff lines a finding sits on, so the reviewer sees the code without leaving the list. A general finding shows
// the first line it cites that the stack changed; a deleted file matches on its old line numbers.
function snippet(st, c) {
  const at = c.path ? [{ path: c.path, from: c.start_line || c.line, to: c.line }]

  for (const { path, from, to } of at) {

    const first = rows.findIndex(hit);

    const lines = rows.slice(Math.max(0, first - 3), Math.min(rows.length, Math.max(last + 3, first + 4), first + 14));

  }
  return null;
}

function addCustom(st, path, r) {

const num = (n) => n.toLocaleString('en-US');
const duration = (m) => (m < 60 ? `${m} min` : `${Math.floor(m / 60)} h${m % 60 ? ` ${m % 60} min` : ''}`);

// How long a careful pass takes with the guide: files to read at reading pace, files to skim much faster, skipped files
// not at all, plus a moment per finding. Deleted lines read faster than added ones.
// ponytail: flat rates; tune them from real sessions if the estimate keeps missing.
function estimate(st) {
  let read = 0, skim = 0, nRead = 0, nSkim = 0;
  for (const f of st.files) {
    const lines = f.adds + Math.ceil(f.dels / 4);
    if (f.role === 'skip') continue;
    if (f.role === 'skim') { skim += lines; nSkim++; } else { read += lines; nRead++; }
  }
  const mins = read / 20 + skim / 100 + comments(st).filter((c) => c.axis).length * 1.5;
  return { mins: Math.max(5, Math.round(mins / 5) * 5), nRead, nSkim, nSkip: st.files.length - nRead - nSkim };
}

// The first thing the reviewer sees: how long it takes, how big it is, whether CI is green, and what the reviewers found.
function tiles(st) {
  const adds = st.files.reduce((t, f) => t + f.adds, 0), dels = st.files.reduce((t, f) => t + f.dels, 0);
  const est = estimate(st);
  const failing = st.prs.filter((p) => p.checks.failed.length);
  const pending = st.prs.reduce((t, p) => t + p.checks.pending, 0), passed = st.prs.reduce((t, p) => t + p.checks.passed, 0);
  const failedNames = failing.flatMap((p) => p.checks.failed);
  const unpushed = SELF && st.prs.every((p) => !p.pushed);
  const ci = unpushed ? { cls: '', v: 'Not pushed', s: 'no CI run on this local work yet' } : failing.length ? { cls: 'bad', v: `✕ ${plural(failedNames.length, 'check', 'checks')} failing`, s: (st.prs.length > 1 ? failing.map((p) => tag(p.n)).join(', ') + ': ' : '') + failedNames.join(', ') }
    : pending ? { cls: 'wait', v: `◌ ${pending} pending`, s: `${passed} passed so far` }
    : { cls: 'ok', v: '✓ Green', s: passed ? `all ${plural(passed, 'check', 'checks')} passed` : 'no checks reported' };
  const live = comments(st).filter((c) => c.axis && c.status !== 'refuted' && !cmState(c).gone);
  const sev = (k) => live.filter((c) => c.severity === k).length;
  const busy = st.pending || st.reviewing.length || st.comments.some((c) => c.status === 'checking');
  const checked = live.filter((c) => c.status === 'verified').length;
  const found = sev('blocker') ? { cls: 'bad', v: plural(sev('blocker'), 'blocker', 'blockers') }
    : sev('should') ? { cls: 'wait', v: plural(sev('should'), 'thing', 'things') + ' to fix' }
    : { cls: busy ? '' : 'ok', v: busy ? 'Nothing blocking yet' : 'Nothing blocking' };
  const rest = [sev('question') && plural(sev('question'), 'question', 'questions'), sev('nit') && plural(sev('nit'), 'nit', 'nits')].filter(Boolean).join(', ');
  const tile = (cls, k, v, sub, extra) => el('div', { class: 'tile ' + cls, title: typeof sub === 'string' ? sub : null }, el('div', { class: 'k' }, k), el('div', { class: 'v' }, v), el('div', { class: 's' }, sub), extra);
  return el('div', { class: 'tiles' },
    tile('', 'Time to review', `about ${duration(est.mins)}`,
      st.pending ? 'a first estimate; the guide sorts the files next' : `read ${est.nRead}, skim ${est.nSkim}${est.nSkip ? `, skip ${est.nSkip}` : ''} files`),
    tile('', 'Size', [el('span', { class: 'add' }, `+${num(adds)}`), el('span', { class: 'del' }, `−${num(dels)}`)],
      `${plural(st.files.length, 'file', 'files')}${st.prs.length > 1 ? ` in ${st.prs.length} ${SELF ? 'layers' : 'PRs'}` : ''}`,
      el('div', { class: 'sizebar', 'aria-hidden': 'true' }, el('span', { class: 'a', style: `width:${adds / Math.max(1, adds + dels) * 100}%` }), el('span', { class: 'd', style: `flex:1` }))),
    tile(ci.cls, 'CI', ci.v, ci.s),
    tile(found.cls, 'Reviewers found', [busy ? el('span', { class: 'spin' }) : null, found.v],
      busy ? `${st.reviewing.length ? 'still reviewing' : 'checking the findings'}${rest ? ` · ${rest}` : ''}`
        : live.length ? [rest || 'nothing else', ` · ${checked} of ${live.length} checked in the code`].join('') : 'no finding on any axis'));
}

function guideView(st) {

      el('summary', {}, SELF ? `${plural(st.prs.length, 'layer', 'layers')} · ` : st.prs.length > 1 ? `${st.prs.length} PRs in this stack · ` : 'Pull request · ', SELF && st.prs.every((p) => !p.pushed) ? el('span', { class: 'ci none' }, 'not pushed') : el('span', { class: 'ci ' + (failing.length ? 'bad' : pending ? 'wait' : 'ok') }, ci)),

    !st.key_facts.length ? null : el('section', { class: 'facts' }, el('h3', {}, 'Know this first'),
      el('ol', {}, st.key_facts.map((f, i) => el('li', {}, el('span', { class: 'n' }, i + 1), el('span', {}, el('b', {}, rich(f.title)), ' ', rich(f.text)))))),

function sinceBox(st) {

      n ? `${plural(n, 'file', 'files')} and ${plural(lines, 'line', 'lines')} changed since; they carry a “new” mark.` : 'Nothing in the stack changed since.'), go);

function fileView(st) {

        f.prs.map((n, j) => [j ? ', ' : 'changed by ', f.pr_links[n] ? ext(f.pr_links[n], tag(n)) : tag(n)]), ' · ', f.link ? ext(f.link, 'stack diff ↗') : null,
        sinceLines(st, f.path) ? [' · ', el('span', { class: 'newmark' }, 'new'), ` ${plural(sinceLines(st, f.path).length, 'line', 'lines')} changed since your last review`] : null)),

const EFFORTS = [['quick', 'Quick'], ['balanced', 'Balanced'], ['deep', 'Deep']];
const EFFORT_HINT = { quick: 'blockers and should-fixes, the brief only', balanced: 'the usual depth', deep: 'reads callers, tests and config; uses Opus' };
let stages = [], usual = {};
const mins = (secs) => { secs = Math.max(1, Math.round(secs)); return secs < 60 ? `${secs} s` : `${Math.floor(secs / 60)} min ${String(secs % 60).padStart(2, '0')} s`; };
const usualText = (lvl) => (usual[lvl] ? `usually about ${Math.max(1, Math.round(usual[lvl] / 60))} min` : '');
const working = (row) => row && row.stages.some((x) => x.state === 'running' || x.state === 'waiting');

function stageText(x) {
  if (x.key === 'check') {
    if (x.state === 'waiting') return 'starts when the reviewers finish';
    if (x.state === 'done') return x.total ? `${plural(x.total, 'finding', 'findings')} checked` : 'nothing to check';
    return [`${x.checked} of ${x.total} checked`, x.last].filter(Boolean).join(' · ');
  }
  if (x.state === 'running') return [x.calls ? plural(x.calls, 'call', 'calls') : 'starting', x.last].filter(Boolean).join(' · ');
  if (x.state === 'failed') return 'failed; see agents.log';
  if (x.state === 'skipped') return x.note || 'skipped';
  if (x.state === 'waiting') return 'waiting';
  return x.key === 'guide' || x.found == null ? 'written' : x.found ? plural(x.found, 'finding', 'findings') : 'nothing found';
}

// Painted in place on every poll, so progress moves without reloading the page.
function paintStrip() {
  const st = ST(), found = stages.find((r) => r.id === st.id);
  // A server started before this page's version still sends a Fetched row and no stack time.
  const row = found && { secs: found.secs ?? Math.max(0, ...found.stages.map((x) => x.secs || 0)), stages: found.stages.filter((x) => x.key !== 'fetch') };
  for (const box of document.querySelectorAll('.runpanel')) {
    if (!working(row)) {
      // A rerun is fetching before any agent starts: show its status line alone.
      box.replaceChildren(...(rerun.running ? [el('div', { class: 'rh' }, el('span', {}, el('span', { class: 'spin', style: 'display:inline-block;vertical-align:-1px;margin-right:8px' }), `${rerun.status || 'Starting'}…`))] : []));
      continue;
    }
    const by = (k) => row.stages.find((x) => x.key === k);
    const finished = (x) => ['done', 'skipped', 'failed'].includes(x.state);
    const check = by('check');
    const parts = row.stages.filter((x) => x.key !== 'check');
    const share = (parts.filter(finished).length + (finished(check) ? 1 : check.total ? check.checked / check.total : 0)) / row.stages.length;
    const phase = !finished(by('guide')) ? 'Writing the guide and reviewing' : parts.some((x) => !finished(x)) ? 'Reviewing' : 'Checking the findings';
    const icon = (x) => x.state === 'running' ? el('span', { class: 'spin' }) : el('span', { class: 'ic' }, { done: '✓', failed: '✕', skipped: '–', waiting: '·' }[x.state]);
    box.replaceChildren(
      el('div', { class: 'rh' }, el('b', {}, phase, el('span', { class: 't' }, ` · ${mins(row.secs)}`)),
        el('span', { class: 'lvl' }, [DATA.effort, usualText(DATA.effort)].filter(Boolean).join(' · '))),
      el('div', { class: 'bar', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': String(Math.round(share * 100)) },
        el('span', { style: `width:${Math.max(3, share * 100)}%` })),
      ...row.stages.map((x) => el('div', { class: `row ${x.state}` }, icon(x), el('span', { class: 'nm' }, x.label),
        el('span', { class: 'd', title: stageText(x) }, stageText(x)), el('span', { class: 't' }, x.secs != null ? mins(x.secs) : ''))));
  }
}

let heads = {}, rerun = { running: false, status: '', error: '' }, rerunOpen = false, effort = DATA.effort || 'balanced';
const stale = (st) => st.prs.filter((p) => heads[p.n] && heads[p.n] !== p.sha);

async function checkHeads() {
  try { const r = await fetch(`/api/r/${BOOT.review}/heads`, { cache: 'no-store' }); if (r.ok) { heads = (await r.json()).heads || {}; render(); } } catch (e) {}
}

async function startRerun() {
  try {
    const r = await fetch(`/api/r/${BOOT.review}/rerun`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Review-Token': TOKEN }, body: JSON.stringify({ effort }) });
    const j = await r.json();
    rerun = r.ok ? j : { ...rerun, error: j.error || r.statusText };
  } catch (e) { rerun = { ...rerun, error: e.message }; }
  render(); if (rerun.running) poll();
}

function rerunBox(st) {
  if (!BOOT.live) return null;
  const moved = stale(st);
  if (!moved.length && !rerun.running && !rerun.error && !rerunOpen) return null;
  if (rerun.running) return null;  // the run panel shows it
  const msg = SELF && moved.length ? `${moved.map((p) => tag(p.n)).join(', ')} ${moved.length === 1 ? 'has' : 'have'} new commits since this guide was built. Rerun it for a new round; your drafts carry over.`
    : moved.length ? `${moved.length === st.prs.length && moved.length > 1 ? 'Every PR' : moved.map((p) => tag(p.n)).join(', ')} ${moved.length === 1 ? 'has' : 'have'} new commits since this guide was built. Posting is blocked until it is rerun.`
    : 'Write the guide again as a new round. Your drafts and viewed files carry over, and this round stays readable.';
  return el('div', { class: 'rerunbox' + (moved.length ? ' stale' : '') },
    el('span', { class: 'msg' }, msg),
    el('span', { class: 'seg', role: 'group', 'aria-label': 'Effort' }, EFFORTS.map(([k, label]) =>
      el('button', { type: 'button', class: 'COMMENT', 'aria-pressed': String(effort === k), title: [EFFORT_HINT[k], usualText(k)].filter(Boolean).join('; '), onclick: () => { effort = k; render(); } }, label))),
    usualText(effort) ? el('span', { class: 'usual' }, usualText(effort)) : null,
    el('button', { class: 'btn primary', type: 'button', onclick: startRerun }, 'Rerun the guide'),
    !moved.length ? el('button', { class: 'btn', type: 'button', onclick: () => { rerunOpen = false; rerun.error = ''; render(); } }, 'Cancel') : null,
    rerun.error ? el('span', { class: 'err' }, rerun.error) : null);
}

const EVENTS = [['COMMENT', 'Comment'], ['APPROVE', 'Approve'], ['REQUEST_CHANGES', 'Changes']];
const RANK = { blocker: 2, should: 2, question: 1, nit: 0, comment: 0 };
const VERB = { COMMENT: 'comment', APPROVE: 'approve', REQUEST_CHANGES: 'request changes' };
let postErr = {}, sending = null;
const verdictState = (p) => (state.verdict[p.n] ??= { body: '' });

// Recomputed from the live comments, so dismissing the last open point turns the suggestion into an approval.
function suggested(p, mine) {
  if (p.author === DATA.viewer) return 'COMMENT';
  const live = mine.filter((c) => !cmState(c).gone && (cmState(c).on || c.status !== 'refuted'));
  if (live.some((c) => cmState(c).sev === 'blocker')) return 'REQUEST_CHANGES';
  return live.some((c) => RANK[cmState(c).sev] >= 1) ? 'COMMENT' : 'APPROVE';
}

function reviewOf(st, p) {
  const vs = verdictState(p);
  const mine = comments(st).filter((c) => c.pr === p.n);
  const sel = mine.filter((c) => cmState(c).on && !cmState(c).gone && cmState(c).text.trim());
  const sug = suggested(p, mine);
  // No verdict until the reviewer picks one, or picks a comment, which brings the suggestion along.
  const event = vs.event === undefined ? (sel.length ? sug : null) : vs.event;
  const data = { pr: p.n, event,
    body: [vs.body.trim(), ...sel.filter((c) => !c.path).map(postText)].filter(Boolean).join('\n\n'),
    comments: sel.filter((c) => c.path).map((c) => ({ path: c.path, line: c.pl, start_line: c.ps || null, body: postText(c) })) };
  const waiting = mine.filter((c) => !cmState(c).on && !cmState(c).gone && c.status === 'verified');
  const own = p.author === DATA.viewer;
  // GitHub needs a body for request-changes, and a body or an inline comment for a comment review.
  const ready = event === 'APPROVE' || !!data.body || event === 'COMMENT' && data.comments.length > 0;
  return { vs, mine, sel, sug, data, waiting, own, ready: !!event && ready, clean: !own && sug === 'APPROVE' && !p.checks.failed.length };
}

async function sendReview(data) {
  const r = await fetch(`${API}/review`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Review-Token': TOKEN }, body: JSON.stringify(data) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j.url;
}

const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
function describe(list) {
  const by = (e) => list.filter((x) => x.data.event === e).length;
  return [by('APPROVE') && plural(by('APPROVE'), 'approval', 'approvals'), by('COMMENT') && plural(by('COMMENT'), 'comment review', 'comment reviews'),
    by('REQUEST_CHANGES') && plural(by('REQUEST_CHANGES'), 'request for changes', 'requests for changes')].filter(Boolean).join(', ');
}

async function postMany(list) {
  if (!BOOT.live) return;
  const inline = list.reduce((t, x) => t + x.data.comments.length, 0);
  const where = list.length === 1 ? `on #${list[0].data.pr}` : `on ${list.length} PRs`;
  if (!confirm(`Post ${describe(list)} ${where} as ${DATA.viewer}, with ${plural(inline, 'inline comment', 'inline comments')}? Authors are notified, and this page cannot edit or delete what it posts.`)) return;
  for (const x of list) {
    sending = x.data.pr; postErr[x.data.pr] = null; render();
    try { posted[x.data.pr] = await sendReview(x.data); } catch (e) { postErr[x.data.pr] = e.message; }
  }
  sending = null; render();
}

// A self-review sends one message to the implementing agent instead of posting per PR.
const SELF_VERDICTS = [['APPROVE', 'Looks good'], ['REQUEST_CHANGES', 'Needs changes']];
let feedbackErr = '', feedbackBusy = false;

function selfPayload(st) {
  const layers = st.prs.map((p) => {
    const vs = verdictState(p);
    const sel = comments(st).filter((c) => c.pr === p.n && cmState(c).on && !cmState(c).gone && cmState(c).text.trim());
    const code = (c) => c.path ? fileOf(st, c.path)?.hunks.flat().find((r) => r.k !== '-' && r.n === c.line)?.t || '' : '';
    return { n: p.n, label: tag(p.n), verdict: { APPROVE: 'looks good', REQUEST_CHANGES: 'needs changes' }[vs.event] || null, summary: vs.body.trim(),
      comments: sel.map((c) => ({ path: c.path, line: c.line, start_line: c.start_line || null, severity: SEV[cmState(c).sev], body: cmState(c).text.trim(), code: code(c) })) };
  });
  return { layers, text: '' };
}

async function sendFeedback(st) {
  const data = selfPayload(st);
  const n = data.layers.reduce((t, x) => t + x.comments.length, 0);
  if (!confirm(`Send ${plural(n, 'comment', 'comments')} and your verdicts to the agent? Nothing leaves this machine, and this round cannot send again.`)) return;
  feedbackBusy = true; feedbackErr = ''; render();
  try {
    flush();
    const r = await fetch(`${API}/feedback`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Review-Token': TOKEN }, body: JSON.stringify(data) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.statusText);
    for (const x of data.layers) posted[x.n] = `sent:${j.sent_at}`;
  } catch (e) { feedbackErr = e.message; }
  feedbackBusy = false; render();
}

function selfSendView(st) {
  const data = selfPayload(st);
  const sentAt = Object.values(posted).find((v) => String(v).startsWith('sent:'));
  const n = data.layers.reduce((t, x) => t + x.comments.length, 0), judged = data.layers.filter((x) => x.verdict).length;
  const waiting = comments(st).filter((c) => !cmState(c).on && !cmState(c).gone && c.status === 'verified');
  const time = sentAt && new Date(+sentAt.slice(5) * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  return [el('h1', {}, 'Your review'),
    el('p', { class: 'summary' }, sentAt ? `Sent to the agent at ${time}. Rerun the guide once it has worked on it, for the next round.`
      : `${plural(n, 'comment', 'comments')} · ${judged} of ${plural(data.layers.length, 'layer', 'layers')} with a verdict. This goes to the agent working on the code, never to GitHub.`),
    rerunBox(st),
    el('div', { class: 'runpanel', 'aria-live': 'polite' }),
    sentAt ? null : el('div', { class: 'bulk' },
      waiting.length ? el('button', { class: 'btn', type: 'button', disabled: feedbackBusy, onclick: () => { waiting.forEach((c) => { cmState(c).on = true; }); save(); render(); } },
        `Add ${plural(waiting.length, 'suggestion', 'suggestions')} checked in the code`) : null,
      el('span', { class: 'grow' }),
      el('button', { class: 'btn primary', type: 'button', disabled: feedbackBusy || (!n && !judged), onclick: () => sendFeedback(st) },
        feedbackBusy ? 'Sending…' : 'Send to the agent')),
    feedbackErr ? el('p', { class: 'status err' }, feedbackErr) : null,
    lostBox(st),
    el('div', { class: 'sendlist' }, st.prs.map((p) => {
      const vs = verdictState(p), key = 'send:' + p.n, open = state.open[key] ?? true, mine = comments(st).filter((c) => c.pr === p.n);
      const count = data.layers.find((x) => x.n === p.n).comments.length;
      const seg = el('span', { class: 'seg', role: 'group', 'aria-label': 'Verdict' }, SELF_VERDICTS.map(([v, l]) =>
        el('button', { type: 'button', class: v, 'aria-pressed': String(vs.event === v), disabled: !!sentAt, onclick: () => { vs.event = vs.event === v ? null : v; save(); render(); } }, l)));
      const row = el('div', { class: 'srow' + (sentAt ? ' done' : '') },
        el('button', { class: 'pick', type: 'button', 'aria-expanded': String(open), onclick: () => { state.open[key] = !open; save(); render(); } },
          el('span', { class: 'chev' }, open ? '▾' : '▸'), prDot(st, p.n), el('b', {}, tag(p.n)), el('span', { class: 't', title: p.title }, ptitle(p))),
        el('span', { class: 'cnt' }, count ? plural(count, 'comment', 'comments') : 'no comment'), seg);
      if (!open) return row;
      const body = el('textarea', { 'aria-label': 'Summary for the agent', placeholder: 'Optional: what the agent should keep in mind for this layer', disabled: !!sentAt,
        oninput: (e) => { vs.body = e.target.value; save(); } });
      body.value = vs.body;
      row.append(el('div', { class: 'sbody' },
        mine.length ? mine.map((m) => commentCard(st, m)) : el('p', { class: 'verdict' }, 'No comment on this layer.'),
        el('div', { class: 'sec' }, 'Summary for the agent'), body));
      return row;
    }))];
}

function sendView(st) {
  if (SELF) return selfSendView(st);
  const rows = st.prs.map((p) => ({ p, ...reviewOf(st, p) }));
  const open = rows.filter((x) => !posted[x.p.n]), done = rows.filter((x) => posted[x.p.n]);
  const ready = open.filter((x) => x.ready);
  const clean = open.filter((x) => x.clean && x.data.event !== 'APPROVE');
  const unclean = open.filter((x) => !x.clean && !x.own && x.data.event !== 'APPROVE').length;
  const waiting = open.flatMap((x) => x.waiting);
  const busy = sending !== null;
  const setAll = (list, f) => { list.forEach(f); save(); render(); };
  const undecided = open.filter((x) => !x.data.event).length;
  return [el('h1', {}, 'Your review'),
    el('p', { class: 'summary' }, [describe(ready) || 'Nothing to post yet', undecided ? ` · ${undecided} without a verdict` : '', done.length ? ` · ${done.length} posted` : ''].join('')),
    rerunBox(st),
    el('div', { class: 'runpanel', 'aria-live': 'polite' }),
    el('div', { class: 'bulk' },
      el('button', { class: 'btn', type: 'button', disabled: busy || !clean.length, title: 'Not yours, CI not failing, and nothing open: no blocker, should-fix or question',
        onclick: () => setAll(clean, (x) => { x.vs.event = 'APPROVE'; }) }, clean.length ? `Approve all clean (${clean.length})` : 'No clean PR left to approve'),
      el('button', { class: 'btn', type: 'button', disabled: busy || !open.length, onclick: () => setAll(open, (x) => { x.vs.event = x.sug; }) }, 'Use the suggested verdicts'),
      el('button', { class: 'btn', type: 'button', disabled: busy || open.length === undecided, onclick: () => setAll(open, (x) => { x.vs.event = null; }) }, 'Clear verdicts'),
      waiting.length ? el('button', { class: 'btn', type: 'button', disabled: busy, onclick: () => setAll(waiting, (c) => { cmState(c).on = true; }) },
        `Add ${plural(waiting.length, 'suggestion', 'suggestions')} checked in the code`) : null,
      el('span', { class: 'grow' }),
      el('button', { class: 'btn primary', type: 'button', disabled: busy || !ready.length, onclick: () => postMany(ready) },
        busy ? `Posting #${sending}…` : ready.length ? `Post ${plural(ready.length, 'review', 'reviews')}` : 'Post')),
    el('p', { class: 'hint' }, `Pick a verdict per PR; a PR without one is not posted. ✦ marks the suggestion: approve when nothing is open.${unclean ? ` ${plural(unclean, 'PR is', 'PRs are')} not clean (failing CI or an open point).` : ''}${st.reviewing.length ? ' Reviewers are still working, so suggestions can change.' : ''}`),
    lostBox(st),
    open.length ? el('div', { class: 'sendlist' }, open.map((x) => prRow(st, x, busy))) : el('p', { class: 'empty' }, 'Every PR in this stack is posted.'),
    done.length ? el('details', { class: 'sendlist donelist', open: !!state.open['send:done'], ontoggle: (e) => { state.open['send:done'] = e.target.open; save(); } },
      el('summary', {}, `Posted (${done.length})`), done.map((x) => prRow(st, x, busy))) : null];
}

// Comments from the previous round whose line is gone from the new diff: shown with their text so nothing is lost silently.
function lostBox(st) {
  const mine = state.lost.filter((c) => st.prs.some((p) => p.n === c.pr));
  if (!mine.length) return null;
  return el('div', { class: 'lostbox' }, el('b', {}, `${plural(mine.length, 'comment', 'comments')} from the previous round could not be placed`),
    ' on the new diff: the line changed or went away. Copy what still applies into a new comment.',
    mine.map((c) => el('div', { class: 'lost' },
      el('p', {}, el('span', { class: 'where' }, `${tag(c.pr)} · ${c.path ? `${c.path.split('/').pop()}:${c.line}` : 'review summary'}`), el('br'), c.text),
      el('button', { class: 'btn', type: 'button', onclick: () => { state.lost = state.lost.filter((x) => x !== c); save(); render(); } }, 'Dismiss'))));
}

function prRow(st, x, busy) {
  const { p, vs, mine, sel, sug, data, waiting, own, ready } = x;
  const key = 'send:' + p.n, open = !!state.open[key], done = posted[p.n];
  const toggle = () => { state.open[key] = !open; save(); render(); };
  const seg = el('span', { class: 'seg', role: 'group', 'aria-label': 'Review type' }, (own ? EVENTS.slice(0, 1) : EVENTS).map(([v, l]) =>
    el('button', { type: 'button', class: v, 'aria-pressed': String(data.event === v), disabled: busy || !!done, title: v === sug ? 'Suggested' : '',
      onclick: () => { vs.event = data.event === v ? null : v; save(); render(); } }, l, v === sug && !own ? ' ✦' : '')));
  const c = p.checks, last = p.last_review;
  const info = el('span', { class: 'cnt' }, sel.length ? plural(sel.length, 'comment', 'comments') : 'no comment',
    waiting.length ? el('span', { class: 'faint' }, ` +${waiting.length} suggested`) : null,
    c.failed.length ? el('span', { class: 'ci bad', title: c.failed.join('\n') }, ' ✕ CI') : null);
  const status = done ? el('span', { class: 'status ok' }, '✓ ', ext(done, 'posted'))
    : sending === p.n ? el('span', { class: 'status' }, 'Posting…') : postErr[p.n] ? el('span', { class: 'status err' }, postErr[p.n])
    : data.event && !ready ? el('span', { class: 'status warn' }, data.event === 'REQUEST_CHANGES' ? 'Request changes needs a summary.' : 'A comment review needs a comment or a summary.')
    : last ? el('span', { class: 'status faint' }, `Last round you ${VERB[{ APPROVED: 'APPROVE', CHANGES_REQUESTED: 'REQUEST_CHANGES' }[last.state] || 'COMMENT']}${last.state === 'APPROVED' ? 'd' : 'ed'} on ${last.at.slice(0, 10)}.`) : null;
  const row = el('div', { class: 'srow' + (done ? ' done' : '') },
    el('button', { class: 'pick', type: 'button', 'aria-expanded': String(open), onclick: toggle },
      el('span', { class: 'chev' }, open ? '▾' : '▸'), prDot(st, p.n), el('b', {}, tag(p.n)), el('span', { class: 't', title: p.title }, ptitle(p))),
    info, done ? el('span') : seg,
    status ? el('div', { class: 'sline' }, status) : null);
  if (!open) return row;
  const body = el('textarea', { 'aria-label': 'Review summary', placeholder: 'Optional summary, posted above the inline comments', disabled: !!done,
    oninput: (e) => { vs.body = e.target.value; save(); } });
  body.value = vs.body;
  const msg = el('span', { class: 'status' });
  const copy = el('button', { class: 'btn', type: 'button', onclick: async () => {
    const d = reviewOf(st, p).data;
    const md = [d.body, ...d.comments.map((m) => `**${m.path}:${m.line}**\n${m.body}`)].join('\n\n---\n\n');
    try { await navigator.clipboard.writeText(md); msg.className = 'status ok'; msg.textContent = 'Copied.'; } catch (e) { msg.className = 'status err'; msg.textContent = 'The browser blocked the clipboard.'; }
  } }, 'Copy as markdown');
  const lag = p.review_sha !== p.sha ? el('p', { class: 'verdict' }, `Comments land on ${p.review_sha.slice(0, 8)}, the version of #${p.n} the PR above it is built on.`) : null;
  const openPts = mine.filter((c) => !cmState(c).gone && (cmState(c).on || c.status !== 'refuted') && RANK[cmState(c).sev] >= 1);
  const why = own ? 'GitHub accepts only comment reviews on your own PR.' : sug === 'APPROVE' ? 'Nothing open on this PR.'
    : `${plural(openPts.length, 'open point', 'open points')}: ${openPts.slice(0, 2).map((c) => c.title).join('; ')}${openPts.length > 2 ? '…' : ''}`;
  row.append(el('div', { class: 'sbody' },
    el('p', { class: 'verdict' }, own ? why : `Suggested ${VERB[sug]}: ${why}`), lag,
    mine.length ? mine.map((m) => commentCard(st, m)) : el('p', { class: 'verdict' }, 'No comment routed to this PR.'),
    el('div', { class: 'sec' }, 'Summary posted with the review'), body,
    el('div', { class: 'actions' },
      el('button', { class: 'btn', type: 'button', disabled: busy || !!done || !ready, onclick: () => postMany([reviewOf(st, p)]) }, `Post only #${p.n}`),
      copy, msg)));
  return row;
}

// opts.line scrolls the diff to that tip line (or the nearest shown one) and marks it; opts.from names the opener.
function openFile(path, opts = {}) {
  state.file = path; state.view = 'file'; save(); render();
  const main = document.getElementById('main');
  main.scrollTo(0, 0);
  if (!opts.line) return;
  const rows = [...main.querySelectorAll('.code .ln')].map((r) => [r, +r.children[1]?.textContent || 0]).filter(([, n]) => n);
  const [row] = rows.reduce((best, x) => (Math.abs(x[1] - opts.line) < Math.abs(best[1] - opts.line) ? x : best), rows[0] || [null, 0]);
  if (!row) return;
  row.classList.add('mark');
  row.scrollIntoView({ block: 'center' });
}

function render() {
  const st = ST();
  if (state.view === 'file' && !fileOf(st, state.file)) state.view = 'guide';
  renderTop(); renderSide();
  const view = state.view === 'send' ? sendView(st) : state.view === 'file' ? fileView(st) : guideView(st);
  const ro = BOOT.live ? null : el('div', { class: 'robox' }, el('b', {}, `Round ${BOOT.round}, an earlier round of this review. `),
    'Read only: nothing is saved or posted from here. ', el('a', { href: `/r/${BOOT.review}` }, 'Open the latest round →'));
  document.getElementById('content').replaceChildren(...[ro, view].flat(Infinity).filter(Boolean));
  paintStrip();
}

function toggleTheme() {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
  fetch('/api/prefs', { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Review-Token': TOKEN }, body: JSON.stringify({ theme: r.dataset.theme }) }).catch(() => {});
}

render();
let version = null;
async function poll() {
  try {
    const j = await (await fetch(`${API}/state`, { cache: 'no-store' })).json();
    posted = j.posted || {};
    stages = j.stages || []; usual = j.usual || {};
    const was = rerun.running;
    if (j.rerun) rerun = j.rerun;
    paintStrip();
    if (was && !rerun.running) render();
    if (version !== null && j.version !== version) { flush(); location.href = `/r/${BOOT.review}`; return; }
    if (version === null) render();
    version = j.version;
  } catch (e) {}
  const busy = rerun.running || stages.some(working) || DATA.stacks.some((s) => s.pending || s.reviewing.length || s.comments.some((c) => c.status === 'checking'));
  // Slow polling otherwise, so a round started from Claude Code moves this page onto it too.
  if (BOOT.live) setTimeout(poll, busy ? 3000 : 15000);
}
poll();
if (BOOT.live) { checkHeads(); document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && checkHeads()); }
</script>
</body>
